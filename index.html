    <script>
        // ==========================================
        // 1. SETUP DUNIA & MATERIAL
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 40, 250);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50); dirLight.castShadow = true; scene.add(dirLight);

        // ==========================================
        // 2. LINGKUNGAN (TANAH & PEREMPATAN)
        // ==========================================
        const matGround = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
        const matRoad = new THREE.MeshStandardMaterial({ color: 0x333333 });
        
        let ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), matGround);
        ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);
        
        let roadZ = new THREE.Mesh(new THREE.PlaneGeometry(30, 1000), matRoad);
        roadZ.rotation.x = -Math.PI / 2; roadZ.receiveShadow = true; scene.add(roadZ);
        
        let roadX = new THREE.Mesh(new THREE.PlaneGeometry(1000, 30), matRoad);
        roadX.rotation.x = -Math.PI / 2; roadX.receiveShadow = true; scene.add(roadX);

        // ==========================================
        // 3. SISTEM ARSITEK (KOTA PADAT & RUMAH BISA MASUK)
        // ==========================================
        const staticColliders = [];
        const dynamicColliders = [];
        const houseDoors = []; 
        const garageDoors = []; 

        function addWall(group, x, y, z, w, h, d, color) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color: color}));
            mesh.position.set(x, y, z);
            mesh.castShadow = true; mesh.receiveShadow = true; mesh.userData.isWall = true; group.add(mesh);
        }

        function buildEnterableHouse(cx, cz, color, hasGarage) {
            const house = new THREE.Group();
            addWall(house, 0, 0.1, 0, 12, 0.2, 12, 0x8B4513); // Lantai
            addWall(house, 0, 2.5, -6, 12, 5, 1, color); // Belakang
            addWall(house, 6, 2.5, 0, 1, 5, 12, color);  // Kanan
            addWall(house, -6, 2.5, 0, 1, 5, 12, color); // Kiri 
            addWall(house, -4, 2.5, 6, 4, 5, 1, color);  // Depan Kiri
            addWall(house, 4, 2.5, 6, 4, 5, 1, color);   // Depan Kanan
            addWall(house, 0, 4.5, 6, 4, 1, 1, color);   // Atas Pintu
            addWall(house, 0, 5.5, 0, 13, 1, 13, 0x333333); // Atap
            
            // FURNITUR
            addWall(house, -2, 0.5, 2, 2.5, 0.8, 1.5, 0x5C4033); // Meja
            addWall(house, -2, 0.3, 3.5, 0.8, 0.6, 0.8, 0xCD853F); // Kursi
            addWall(house, 5, 1.5, -4, 1, 3, 2, 0x654321); // Lemari
            addWall(house, -4, 0.4, -4, 3, 0.6, 4, 0x0000FF); // Kasur

            // PINTU RUMAH (Interaktif)
            const doorGroup = new THREE.Group();
            doorGroup.position.set(-2, 2, 6);
            const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 0.3), new THREE.MeshStandardMaterial({color: 0xA0522D}));
            doorMesh.position.set(2, 0, 0); doorMesh.castShadow = true; doorGroup.add(doorMesh);
            house.add(doorGroup);
            dynamicColliders.push(doorMesh); houseDoors.push({ group: doorGroup, isOpen: false, timer: 0 });

            // GARASI
            if (hasGarage) {
                addWall(house, -11, 0.1, 0, 9, 0.2, 12, 0x555555); // Lantai Garasi
                addWall(house, -11, 2.5, -6, 9, 5, 1, color);      // Belakang Garasi
                addWall(house, -16, 2.5, 0, 1, 5, 12, color);      // Kiri Garasi
                addWall(house, -11, 5.5, 0, 11, 1, 13, 0x333333);  // Atap Garasi

                const gDoor = new THREE.Mesh(new THREE.BoxGeometry(9, 4.8, 0.5), new THREE.MeshStandardMaterial({color: 0x888888}));
                gDoor.position.set(-11.5, 2.5, 6); gDoor.castShadow = true; house.add(gDoor);
                dynamicColliders.push(gDoor); garageDoors.push({ mesh: gDoor, closedY: 2.5, openY: 7.5, isOpen: false });
            }

            house.position.set(cx, 0, cz); scene.add(house); house.updateMatrixWorld(true);
            
            house.children.forEach(c => {
                if(c.userData.isWall) staticColliders.push(new THREE.Box3().setFromObject(c));
            });
        }

        buildEnterableHouse(-35, 35, 0xFFE4B5, true);   
        buildEnterableHouse(35, 35, 0xADD8E6, true);    
        buildEnterableHouse(-35, -35, 0x98FB98, true);  

        // ALGORITMA KOTA PADAT
        const cityColors = [0xFF8C00, 0x1E90FF, 0x32CD32, 0xFF69B4, 0x8A2BE2, 0xFFFFFF, 0x808080, 0x222222, 0xDDA0DD];
        
        function buildSolidBlock(cx, cz, w, h, d, color) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color: color}));
            mesh.position.set(cx, h/2, cz);
            mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
            mesh.updateMatrixWorld(); staticColliders.push(new THREE.Box3().setFromObject(mesh));
        }

        for (let x = -150; x <= 150; x += 30) {
            for (let z = -150; z <= 150; z += 30) {
                if (Math.abs(x) < 25 || Math.abs(z) < 25) continue;
                if (Math.abs(x - (-35)) < 15 && Math.abs(z - 35) < 15) continue; 
                if (Math.abs(x - 35) < 15 && Math.abs(z - 35) < 15) continue; 
                if (Math.abs(x - (-35)) < 15 && Math.abs(z - (-35)) < 15) continue;

                let height = 10 + Math.random() * 50; 
                let col = cityColors[Math.floor(Math.random() * cityColors.length)];
                buildSolidBlock(x, z, 26, height, 26, col);
            }
        }

        // ==========================================
        // 4. KENDARAAN (MOBIL GARASI & TRAFFIC AI)
        // ==========================================
        const playerCars = [];
        const trafficCars = [];

        function buildCar(type, color) {
            let group = new THREE.Group();
            let matBody = new THREE.MeshStandardMaterial({color: color});
            let matTire = new THREE.MeshStandardMaterial({color: 0x111111});
            let wGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
            [[-1.2, 0.5, 1.5], [1.2, 0.5, 1.5], [-1.2, 0.5, -1.5], [1.2, 0.5, -1.5]].forEach(pos => {
                let w = new THREE.Mesh(wGeo, matTire); w.rotation.z = Math.PI/2;
                w.position.set(...pos); w.castShadow = true; group.add(w);
            });
            if (type === 'sedan') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 4.5), matBody); b.position.set(0,1,0); b.castShadow = true; group.add(b);
                let r = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 2.5), new THREE.MeshStandardMaterial({color: 0x222222})); r.position.set(0,1.9,-0.5); r.castShadow = true; group.add(r);
            } else if (type === 'van') {
                let b = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 5), matBody); b.position.set(0,1.6,0); b.castShadow = true; group.add(b);
            } else if (type === 'truck') {
                let c = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 2), matBody); c.position.set(0,1.5,1.5); c.castShadow = true; group.add(c);
                let box = new THREE.Mesh(new THREE.BoxGeometry(2.8, 3, 4), new THREE.MeshStandardMaterial({color: 0xFFFFFF})); box.position.set(0,2,-1.5); box.castShadow = true; group.add(box);
            }
            return group;
        }

        let pCar1 = buildCar('sedan', 0xFF4136); pCar1.position.set(-46, 0, 35); scene.add(pCar1); playerCars.push(pCar1); 
        let pCar2 = buildCar('sedan', 0xFFFFFF); pCar2.position.set(24, 0, 35); scene.add(pCar2); playerCars.push(pCar2);  
        let pCar3 = buildCar('van', 0xFFFF00); pCar3.position.set(-46, 0, -35); scene.add(pCar3); playerCars.push(pCar3);  

        function spawnTraffic(type, color, x, z, rotY, axis, speed) {
            let car = buildCar(type, color); car.position.set(x, 0, z); car.rotation.y = rotY; scene.add(car);
            trafficCars.push({ mesh: car, axis: axis, speed: speed });
        }
        spawnTraffic('truck', 0x1E90FF, 6, 100, 0, 'z', -0.2); 
        spawnTraffic('sedan', 0x8A2BE2, -6, -100, Math.PI, 'z', 0.25); 
        spawnTraffic('van', 0xFF8C00, 100, 6, -Math.PI/2, 'x', -0.15); 
        spawnTraffic('sedan', 0x32CD32, -100, -6, Math.PI/2, 'x', 0.2); 

        // ==========================================
        // 5. NPC AI PEJALAN KAKI
        // ==========================================
        const npcs = [];
        function spawnNPC(x, z, color, speed, axis, limA, limB) {
            let npc = new THREE.Group();
            let b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.8), new THREE.MeshStandardMaterial({color: color})); b.position.set(0,0.6,0); b.castShadow=true; npc.add(b);
            let h = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({color: 0xFFFFFF})); h.position.set(0,1.5,0); h.castShadow=true; npc.add(h);
            npc.position.set(x, 0, z); scene.add(npc); npcs.push({ mesh: npc, speed: speed, axis: axis, limitA: limA, limitB: limB, dir: 1 });
        }
        spawnNPC(-18, -20, 0xFF69B4, 0.05, 'z', -80, 80); 
        spawnNPC(18, 30, 0x00FA9A, 0.04, 'z', -80, 80);   
        spawnNPC(30, -18, 0xFF4500, 0.06, 'x', -80, 80);  

        // ==========================================
        // 6. PEMAIN, KONTROL & KAMERA (BUG FIX KAMERA)
        // ==========================================
        const player = new THREE.Group();
        let pBody = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 1), new THREE.MeshStandardMaterial({color: 0x0074D9})); pBody.position.y = 0.75; pBody.castShadow = true; player.add(pBody);
        let pHead = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({color: 0xFFDC00})); pHead.position.y = 1.9; pHead.castShadow = true; player.add(pHead);
        
        player.position.set(-20, 0, 35); player.rotation.y = Math.PI/2; scene.add(player);

        let isFirstPerson = false;
        const btnToggleCam = document.getElementById('btn-camera-toggle');
        btnToggleCam.addEventListener('pointerdown', (e) => {
            e.preventDefault(); isFirstPerson = !isFirstPerson;
            btnToggleCam.innerText = isFirstPerson ? "POV: FPS" : "POV: TPS";
            player.children.forEach(c => c.visible = !isFirstPerson);
        });

        let fwdInput = 0, strafeInput = 0, camPitch = 0, camYaw = 0;   
        const joystick = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '50%', top: '50%' }, color: 'white' });
        joystick.on('move', (evt, data) => { fwdInput = data.vector.y; strafeInput = data.vector.x; });
        joystick.on('end', () => { fwdInput = 0; strafeInput = 0; });

        let activeCamId = null, lastX = 0, lastY = 0;
        document.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'CANVAS' && e.clientX > window.innerWidth/2 && activeCamId === null) {
                activeCamId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
            }
        });
        document.addEventListener('pointermove', (e) => {
            if (activeCamId !== e.pointerId) return; 
            let dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            
            if (!isDriving) player.rotation.y -= dx * 0.005; else camYaw -= dx * 0.005; 
            
            // PERBAIKAN KAMERA NORMAL:
            // Geser jari ke atas (dy negatif) -> kamera mendongak (Pitch negatif)
            // Geser jari ke bawah (dy positif) -> kamera menunduk (Pitch positif)
            camPitch += dy * -0.005; 
            camPitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, camPitch)); 
        });
        const releaseCam = (e) => { if (activeCamId === e.pointerId) activeCamId = null; };
        document.addEventListener('pointerup', releaseCam); document.addEventListener('pointercancel', releaseCam);

        // ==========================================
        // 7. SISTEM COLLISION & TURUN MOBIL PINTAR
        // ==========================================
        function checkCollision(obj, isY = false) {
            obj.updateMatrixWorld(); 
            let box = new THREE.Box3().setFromObject(obj); 
            box.expandByScalar(-0.2); 
            if (!isY) box.min.y += 0.5; 
            
            for(let b of staticColliders) if(box.intersectsBox(b)) return true;
            for(let dMesh of dynamicColliders) if(box.intersectsBox(new THREE.Box3().setFromObject(dMesh))) return true;
            return false;
        }

        const btnInteract = document.getElementById('btn-interact'), btnGarage = document.getElementById('btn-garage');
        const btnSprint = document.getElementById('btn-sprint'), btnJump = document.getElementById('btn-jump');
        
        let isJumping = false, isSprinting = false, velocityY = 0, isDriving = false, activeCar = null, carVel = 0, nearestGarage = null;

        // FUNGSI CEK LOKASI TURUN AMAN (Anti Nyangkut)
        function findSafeExitPosition(carMesh) {
            // Urutan prioritas turun: Kiri mobil, Kanan mobil, Belakang mobil, Depan mobil
            const exitOffsets = [
                new THREE.Vector3(-3, 0, 0),  // Kiri
                new THREE.Vector3(3, 0, 0),   // Kanan
                new THREE.Vector3(0, 0, -4),  // Belakang
                new THREE.Vector3(0, 0, 4)    // Depan
            ];
            
            for (let offset of exitOffsets) {
                // Kalkulasi posisi berdasarkan rotasi mobil saat ini
                let testPos = carMesh.position.clone().add(offset.clone().applyEuler(carMesh.rotation));
                
                // Letakkan pemain di testPos sementara untuk dicek
                player.position.copy(testPos);
                
                // Jika posisi ini TIDAK tabrakan dengan tembok/garasi, ini posisi aman!
                if (!checkCollision(player, false)) {
                    return testPos;
                }
            }
            
            // Jika semua sisi mentok (sangat jarang terjadi), paksa taruh di atas mobil
            return carMesh.position.clone().add(new THREE.Vector3(0, 3, 0));
        }

        const toggleCar = (e) => {
            if(e) e.preventDefault();
            if (!isDriving && activeCar) {
                isDriving = true; camYaw = 0; player.visible = false; 
                btnSprint.style.display = 'none'; btnJump.style.display = 'none'; btnInteract.innerText = 'TURUN';
            } else if (isDriving) {
                isDriving = false; camYaw = 0; player.visible = true; 
                
                // Panggil fungsi pintar anti-nyangkut
                let safePos = findSafeExitPosition(activeCar);
                player.position.copy(safePos);
                
                activeCar = null;
                btnSprint.style.display = 'flex'; btnJump.style.display = 'flex'; btnInteract.style.display = 'none'; btnInteract.innerText = 'NAIK';
            }
        };

        btnInteract.addEventListener('pointerdown', toggleCar);
        btnGarage.addEventListener('pointerdown', (e) => { e.preventDefault(); if(nearestGarage) nearestGarage.isOpen = !nearestGarage.isOpen; });
        btnSprint.addEventListener('touchstart', (e) => { e.preventDefault(); isSprinting = true; }); btnSprint.addEventListener('touchend', (e) => { e.preventDefault(); isSprinting = false; });
        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isJumping && !isDriving) { velocityY = 0.35; isJumping = true; }});

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            if(e.key==='w') keys.w=true; if(e.key==='s') keys.s=true; if(e.key==='a') keys.a=true; if(e.key==='d') keys.d=true;
            if(e.key==='Shift') isSprinting = true; if(e.code==='Space' && !isJumping && !isDriving) { velocityY = 0.35; isJumping = true; } if(e.code==='KeyF') toggleCar();
        });
        window.addEventListener('keyup', (e) => {
            if(e.key==='w') keys.w=false; if(e.key==='s') keys.s=false; if(e.key==='a') keys.a=false; if(e.key==='d') keys.d=false; if(e.key==='Shift') isSprinting=false;
        });

        // ==========================================
        // 8. ANIMASI UTAMA & LOGIKA GAME
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            let time = Date.now() * 0.005;

            // AI NPC
            npcs.forEach(npc => {
                npc.mesh.position[npc.axis] += npc.speed * npc.dir;
                npc.mesh.position.y = Math.abs(Math.sin(time + npc.mesh.position.x)) * 0.2;
                if (npc.mesh.position[npc.axis] > npc.limitB || npc.mesh.position[npc.axis] < npc.limitA) {
                    npc.dir *= -1; npc.mesh.rotation.y += Math.PI;
                }
            });

            // AI KENDARAAN (Looping)
            trafficCars.forEach(car => {
                car.mesh.position[car.axis] += car.speed;
                if (car.mesh.position[car.axis] > 200) car.mesh.position[car.axis] = -200;
                if (car.mesh.position[car.axis] < -200) car.mesh.position[car.axis] = 200;
            });

            // LOGIKA PEMAIN (Jalan / Nyetir)
            let moveZ = -fwdInput, moveX = strafeInput;
            if (keys.w) moveZ = -1; if (keys.s) moveZ = 1; if (keys.a) moveX = -1; if (keys.d) moveX = 1;

            if (!isDriving) {
                let speed = isSprinting ? 0.3 : 0.15; let oldPos = player.position.clone();
                player.translateX(moveX * speed); player.translateZ(moveZ * speed); 
                if (checkCollision(player, false)) { player.position.x = oldPos.x; player.position.z = oldPos.z; }

                let oldY = player.position.y; velocityY -= 0.015; player.position.y += velocityY;
                if (checkCollision(player, true)) { player.position.y = oldY; if(velocityY > 0) velocityY = 0; else { velocityY = 0; isJumping = false; } } 
                else if (player.position.y <= 0) { player.position.y = 0; velocityY = 0; isJumping = false; }

                // Deteksi Mobil Interaksi
                let terdekat = null, jarakMin = 5;
                playerCars.forEach(car => { if (player.position.distanceTo(car.position) < jarakMin) { jarakMin = player.position.distanceTo(car.position); terdekat = car; } });
                if (terdekat) { activeCar = terdekat; btnInteract.style.display = 'flex'; } else { activeCar = null; btnInteract.style.display = 'none'; }
            } else {
                let oldCarPos = activeCar.position.clone();
                carVel += (-moveZ * 0.02); carVel *= 0.95; 
                if (Math.abs(carVel) > 0.02) activeCar.rotation.y += moveX * -0.04 * (carVel > 0 ? 1 : -1);
                activeCar.translateZ(-carVel);
                if (checkCollision(activeCar, false)) { activeCar.position.copy(oldCarPos); carVel = 0; }
                if (activeCamId === null) camYaw += (0 - camYaw) * 0.05; 
            }

            // PINTU RUMAH INTERAKTIF (Buka 80 derajat kalau ditabrak)
            let pWorld = new THREE.Vector3(); player.getWorldPosition(pWorld);
            houseDoors.forEach(d => {
                let dWorld = new THREE.Vector3(); d.group.getWorldPosition(dWorld);
                if (pWorld.distanceTo(dWorld) < 4) { d.isOpen = true; d.timer = 0; } 
                else { d.timer++; if (d.timer > 200) d.isOpen = false; } 
                d.group.rotation.y += ((d.isOpen ? Math.PI/2.2 : 0) - d.group.rotation.y) * 0.1;
            });

            // TOMBOL GARASI MUNCUL
            let adaGarasi = null;
            garageDoors.forEach(gd => {
                let gWorld = new THREE.Vector3(); gd.mesh.getWorldPosition(gWorld);
                if(pWorld.distanceTo(gWorld) < 15) adaGarasi = gd;
                gd.mesh.position.y += ((gd.isOpen ? gd.openY : gd.closedY) - gd.mesh.position.y) * 0.1;
            });
            if(adaGarasi) { nearestGarage = adaGarasi; btnGarage.style.display = 'flex'; } else { nearestGarage = null; btnGarage.style.display = 'none'; }

            // LOGIKA KAMERA 
            if (isFirstPerson && !isDriving) {
                let idealPos = player.position.clone().add(new THREE.Vector3(0, 1.8, 0)); camera.position.copy(idealPos); 
                let dir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(camPitch, player.rotation.y, 0, 'YXZ'));
                camera.lookAt(idealPos.clone().add(dir));
            } else {
                const targetObj = isDriving ? activeCar : player;
                const baseH = isDriving ? 6 : 4, baseZ = isDriving ? 15 : 10;
                let localOffset = new THREE.Vector3(isDriving ? Math.sin(camYaw)*baseZ : 0, baseH + camPitch*5, isDriving ? Math.cos(camYaw)*baseZ : baseZ);
                let idealPos = targetObj.position.clone().add(localOffset.clone().applyEuler(targetObj.rotation));
                if (idealPos.y < 0.5) idealPos.y = 0.5; // Kamera Anti-Tembus Bawah Tanah
                camera.position.lerp(idealPos, 0.2); camera.lookAt(targetObj.position.clone().add(new THREE.Vector3(0, 2, 0)));
            }

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
